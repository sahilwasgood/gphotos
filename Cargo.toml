[package]
name = "gphotos-app"
version = "1.1.0"
edition = "2021"
description = "Hand-drawn native desktop client for Google Photos"
authors = ["gphotos-app contributors"]
license = "GPL-3.0"
repository = "https://github.com/sahilwasgood/gphotos"
readme = "README.md"

[dependencies]
eframe = { version = "0.29", default-features = false, features = ["default_fonts", "glow", "wayland", "x11"] }
rusqlite = { version = "0.32", features = ["bundled"] }
image = { version = "0.25", default-features = false, features = ["png", "jpeg", "webp", "gif"] }
serde_json = "1"
dirs = "6"
rfd = "0.18"
arboard = "3"
cpal = "0.15"

[profile.release]
opt-level = 2
lto = false
